name: Windows GPUI package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            target: x86_64-pc-windows-msvc
            wix_arch: x64
          - architecture: aarch64
            target: aarch64-pc-windows-msvc
            wix_arch: arm64
    runs-on: windows-2025
    env:
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-${{ matrix.target }}
      - name: Validate architecture boundaries
        shell: bash
        run: bash scripts/check-architecture-boundaries.sh
      - name: Package native GPUI executable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "dev-${{ github.sha }}" }
          ./scripts/package-windows.ps1 -Architecture "${{ matrix.architecture }}" -Version $version
      - name: Sign native GPUI executable
        if: env.WINDOWS_SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "nyaterm-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD target/${{ matrix.target }}/release/nyaterm.exe
          Remove-Item $certificate -Force
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "dev-${{ github.sha }}" }
          ./scripts/package-windows.ps1 -Architecture "${{ matrix.architecture }}" -Version $version -SkipBuild
      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.0.0" }
          $binary = (Resolve-Path "target/${{ matrix.target }}/release/nyaterm.exe").Path
          wix build packaging/windows/NyaTerm.wxs `
            -arch "${{ matrix.wix_arch }}" `
            -d "Version=$version" `
            -d "BinaryPath=$binary" `
            -o "dist/NyaTerm-$version-windows-${{ matrix.architecture }}.msi"
      - name: Sign MSI installer
        if: env.WINDOWS_SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "nyaterm-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          Get-ChildItem dist/*.msi | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $_.FullName
          }
          Remove-Item $certificate -Force
      - name: Validate archive manifest
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/NyaTerm-*-windows-${{ matrix.architecture }}.zip | Select-Object -First 1
          if (-not $archive) { throw "Package archive missing" }
          $entries = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName).Entries.FullName
          if ($entries -notcontains "NyaTerm.exe") { throw "NyaTerm.exe missing from archive" }
          Get-FileHash $archive.FullName -Algorithm SHA256
          $msi = Get-ChildItem dist/NyaTerm-*-windows-${{ matrix.architecture }}.msi | Select-Object -First 1
          if (-not $msi -or $msi.Length -lt 1024) { throw "MSI package missing or invalid" }
          Get-FileHash $msi.FullName -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $($msi.Name)" | Set-Content "$($msi.FullName).sha256" -NoNewline
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nyaterm-windows-${{ matrix.architecture }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.msi
          if-no-files-found: error
